<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAT, הנדסת חלבונים ודלקת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --surface:#fff; --ink:#1b2232; --muted:#535d73; --line:#d6dce7; --soft:#eef1f6;
  --primary:#2453c2; --primary-dark:#1b3f96; --primary-soft:#e7edfb;
  --ok:#156b3c; --ok-bg:#e3f3e9; --ok-line:#7cc39a;
  --bad:#b2261b; --bad-bg:#fdebe8; --bad-line:#eb9a91;
  --info-bg:#fff7df; --info-line:#e6c766;
  --ext:#6a3db3; --ext-bg:#efe8fa;
  --beta:#e4572e; --alpha:#3a9a57; --rcl:#1f6fb2; --ela:#7b3fa0; --sugar:#d39b16;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,60,.07),0 6px 18px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo','Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.65}
button{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid #f0a020;outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
bdi{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 16px}
.brand{font-weight:800;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:.92rem}
.tbtn:hover{background:var(--soft)}
.tbtn svg{width:18px;height:18px}
.progress{height:6px;background:var(--soft)}
.progress > div{height:100%;background:var(--primary);transition:width .3s}

main{max-width:880px;margin:0 auto;padding:20px 16px 40px}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#1f4bb3,#3a74e0);color:#fff;border-radius:var(--radius);padding:26px 22px;margin-bottom:22px;display:flex;gap:18px;align-items:center}
.hero h1{margin:0 0 6px;font-size:1.65rem;line-height:1.25}
.hero p{margin:0;opacity:.95}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ucard{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.ucard:hover{transform:translateY(-2px);border-color:var(--primary)}
.ucard .num{font-size:.8rem;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:2px 10px;align-self:flex-start}
.ucard h3{margin:2px 0;font-size:1.08rem;line-height:1.35}
.ucard .meta{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted);margin-top:auto;padding-top:6px}
.status{display:inline-flex;align-items:center;gap:4px;font-weight:600;border-radius:999px;padding:1px 9px;font-size:.8rem}
.status.new{background:var(--soft);color:var(--muted)}
.status.progress{background:var(--info-bg);color:#7a5600}
.status.done{background:var(--ok-bg);color:var(--ok)}
.ucard.challenge{background:linear-gradient(180deg,#fff,#fff8e8);border-color:#e9cf86}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:space-between;align-items:center}
.notice{background:var(--info-bg);border:1px solid var(--info-line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}

/* ---------- screen ---------- */
.unit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 26px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:1.45rem;line-height:1.3;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.kicker{font-size:.85rem;font-weight:700;color:var(--primary);margin-bottom:4px}
.txt p{margin:0 0 10px}
.txt{font-size:1.05rem}
.after{margin-top:14px;font-size:1rem}
.after p{margin:0 0 8px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 9px;vertical-align:middle;line-height:1.7}
.tag.ext{background:var(--ext-bg);color:var(--ext);border:1px solid #cdb8ef}
.tag.fix{background:#fff1e0;color:#9a4b00;border:1px solid #f2c38f}
.tag.practice{background:var(--primary-soft);color:var(--primary-dark)}
.goals{background:var(--soft);border-radius:12px;padding:14px 18px;margin:12px 0}
.goals h3{margin:0 0 6px;font-size:1rem}
.goals ul{margin:0;padding-inline-start:20px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:10px;padding:10px 20px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:var(--surface);color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.small{padding:6px 14px;min-height:36px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{background:var(--surface);color:var(--bad);border-color:var(--bad-line)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- terms & popover ---------- */
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;border-bottom:2px dotted var(--primary);line-height:1.2}
.term:hover{background:var(--primary-soft)}
.pop{position:absolute;z-index:50;max-width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(10,20,50,.2);padding:12px 14px;font-size:.95rem}
.pop-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.pop-h .en{color:var(--muted);font-size:.85rem}
.pop p{margin:0 0 8px}
.pop-a{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;color:var(--primary);cursor:pointer;padding:4px 0;text-decoration:underline;font-size:.9rem}
.xbtn{background:var(--soft);border:0;border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:1.1rem;line-height:1}

/* ---------- glossary ---------- */
.gsearch{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 14px}
.glist{display:grid;gap:8px}
.gitem{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
.gitem strong{font-size:1.02rem}
.gitem .en{color:var(--muted);font-size:.88rem;margin-inline-start:6px}
.gitem p{margin:2px 0 0}

/* ---------- figures ---------- */
.fig{margin:16px 0 6px}
.fig-svg{width:100%;height:auto;display:block;max-height:420px}
.fig-cap{text-align:center;color:var(--muted);font-size:.88rem;margin-top:4px}
.panel{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.panel h4{margin:0 0 4px;font-size:1rem}
.panel p{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.illus{background:#f8fafd;border:1px solid var(--line);border-radius:12px;padding:8px}

/* hotspots */
.spot{cursor:pointer;outline:none}
.spot .hit{fill:transparent;stroke:transparent}
.spot:hover .hl,.spot:focus-visible .hl,.spot.active .hl{stroke:#f0a020;stroke-width:3;stroke-dasharray:5 3;fill:rgba(240,160,32,.12)}
.spot:focus-visible .hit{stroke:#f0a020;stroke-width:3}
.spot.correct .hl{stroke:var(--ok);stroke-width:3.5;stroke-dasharray:none;fill:rgba(21,107,60,.12)}
.spot.wrong .hl{stroke:var(--bad);stroke-width:3;stroke-dasharray:4 3;fill:rgba(178,38,27,.08)}
.spot-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.93rem}
.chipbtn[aria-pressed="true"],.chipbtn:hover{border-color:var(--primary);background:var(--primary-soft)}

/* stepper */
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.dots{display:flex;gap:6px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--primary)}
.step-text{background:var(--soft);border-radius:12px;padding:12px 16px;margin-top:10px;min-height:64px}
.step-text .sn{font-weight:700;color:var(--primary);margin-inline-end:6px}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.fcard .n{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.fcard .ft{font-weight:700}
.fcard .fb2{font-size:.93rem;color:var(--ink);display:none}
.fcard[aria-expanded="true"]{background:var(--primary-soft);border-color:var(--primary)}
.fcard[aria-expanded="true"] .fb2{display:block}
.fcard .hint{font-size:.8rem;color:var(--muted)}
.fcard[aria-expanded="true"] .hint{display:none}

/* journey */
.journey{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;position:relative;padding:8px 0}
.station{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;background:none;border:0;cursor:pointer;padding:6px;border-radius:12px}
.station .c{width:52px;height:52px;border-radius:50%;background:var(--surface);border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);font-size:1.1rem}
.station[aria-pressed="true"] .c{background:var(--primary);color:#fff}
.station .l{font-size:.86rem;font-weight:600;text-align:center;line-height:1.3}
.station:hover{background:var(--soft)}
.jline{flex:0 0 14px;align-self:center;height:3px;background:repeating-linear-gradient(90deg,var(--primary) 0 6px,transparent 6px 10px);margin-top:-30px}
@media (max-width:560px){.jline{display:none}.station{width:96px}}

/* alignment */
.align-wrap{overflow-x:auto}
table.align{border-collapse:collapse;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem}
table.align td,table.align th{padding:3px 0;text-align:center;min-width:24px}
table.align th.sp{font-family:'Heebo',system-ui,sans-serif;font-weight:600;text-align:right;padding-inline:10px;white-space:nowrap}
table.align td.aa{cursor:pointer;border-radius:3px}
table.align .colh button{border:0;background:none;cursor:pointer;font-size:.7rem;color:var(--muted);padding:2px;width:100%}
table.align td.hov{background:#ffe9b8}
table.align td.cons-show{background:#d7efe0}
table.align td.hov.cons{background:#bfe5cd}
.align-status{text-align:center;margin-top:8px;min-height:2em;font-weight:600}
.note-ill{display:inline-block;font-size:.8rem;background:var(--info-bg);border:1px solid var(--info-line);border-radius:999px;padding:1px 10px;margin-bottom:6px}

/* steps reveal */
.reveal-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reveal-list li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;animation:fadein .35s}
.reveal-list .no{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);font-weight:700;display:flex;align-items:center;justify-content:center}
.reveal-list .st{margin-inline-start:auto;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st0{background:#e3ecfc;color:#1f4bb3}.st1{background:#e6f4ea;color:#17703f}.st2{background:#fdeee3;color:#9a4b00}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* id card */
.idcard{border:2px solid #1f4bb3;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#fff,#f4f8ff);max-width:620px;margin:0 auto}
.idcard .idh{background:#1f4bb3;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.idcard .idb{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px 16px}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.idcard dt{font-weight:700;color:#1f4bb3;white-space:nowrap}
.idcard dd{margin:0}
@media (max-width:560px){.idcard .idb{grid-template-columns:1fr}.idcard .idb svg{max-width:120px;margin:0 auto}.idcard dl{grid-template-columns:1fr}.idcard dt{margin-top:4px}}

/* walls */
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wall{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:center}
.wall.hi{border:2px solid var(--primary);background:var(--primary-soft)}
.wall h4{margin:4px 0}
.wall p{margin:0;font-size:.92rem}
@media (max-width:560px){.walls{grid-template-columns:1fr}}

/* table */
.table-wrap{overflow-x:auto}
table.ctable{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
table.ctable th,table.ctable td{border-bottom:1px solid var(--line);padding:8px;text-align:start;vertical-align:top}
table.ctable th{background:var(--soft)}
.pill{display:inline-block;border-radius:999px;padding:0 8px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill.pro{background:#fde7e4;color:#a3241a}
.pill.anti{background:#e2f2e8;color:#17703f}

/* switches */
.switches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.sw input{width:20px;height:20px;accent-color:var(--primary)}
.sw.pro{border-inline-start:5px solid #d9534f}.sw.anti{border-inline-start:5px solid #2e9d5b}.sw.trig{border-inline-start:5px solid #8a6d3b}
.state-badge{display:inline-block;font-weight:700;border-radius:999px;padding:2px 12px}
.state-badge.good{background:var(--ok-bg);color:var(--ok)}
.state-badge.prot{background:var(--info-bg);color:#7a5600}
.state-badge.harm{background:var(--bad-bg);color:var(--bad)}

/* slider */
.slider{display:grid;gap:4px;margin-top:8px}
.slider input{width:100%;accent-color:var(--primary);height:32px}
.slider .ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.chain{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.chain li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface);transition:all .3s;opacity:.45}
.chain li.on{opacity:1;border-color:var(--bad-line);background:var(--bad-bg)}
.chain .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700}
.meter{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.meter > div{height:100%;background:linear-gradient(90deg,#2e9d5b,#7cc39a);transition:width .3s}

/* roles */
.roles{display:grid;gap:8px}
.role{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.role > button{width:100%;text-align:start;background:none;border:0;padding:12px 14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.role > div{padding:0 14px 12px;display:none}
.role.open{border-color:var(--primary)}
.role.open > button{background:var(--primary-soft)}
.role.open > div{display:block;padding-top:10px}

/* ---------- practice ---------- */
.qprompt{font-size:1.12rem;font-weight:600;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:48px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt .let{flex:0 0 30px;height:30px;border-radius:50%;background:var(--soft);font-weight:700;display:flex;align-items:center;justify-content:center}
.opt .otx{flex:1}
.opt .mark{flex:0 0 auto;font-weight:800;font-size:1.15rem}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .let{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);opacity:1;cursor:default}
.opt.wrong .let{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.mark-ok{color:var(--ok)}.mark-bad{color:var(--bad)}

.fb{display:none;margin-top:12px;border-radius:12px;padding:12px 14px;gap:10px;align-items:flex-start;border:1px solid}
.fb.show{display:flex}
.fb .ic{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.ok .ic{background:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.fb.bad .ic{background:var(--bad)}
.fb.info{background:var(--info-bg);border-color:var(--info-line)}
.fb.info .ic{background:#a67c00}
.fb .ft{font-weight:700;display:block}

.checklist{display:grid;gap:6px}
/* tf */
.tf-list{display:grid;gap:10px}
.tf-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.tf-item .stmt{font-weight:600;margin-bottom:8px}
.tf-btns{display:flex;gap:8px;flex-wrap:wrap}
.tfb{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 18px;cursor:pointer;font-weight:600;min-height:40px}
.tfb:hover:not(:disabled){border-color:var(--primary)}
.tfb.correct{border-color:var(--ok);background:var(--ok-bg)}
.tfb.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.tf-item .fb{margin-top:8px}

/* sort */
.pool{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;background:#fafbfd}
.pool.empty::after{content:'כל הפריטים מוינו';color:var(--muted);font-size:.9rem;align-self:center}
.bins{display:grid;gap:10px;margin-top:12px}
.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:620px){.bins.n3{grid-template-columns:1fr}}
@media (max-width:420px){.bins.n2{grid-template-columns:1fr}}
.bin{border:2px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;min-height:130px;transition:border-color .15s,background .15s}
.bin .bh{font-weight:700;padding:8px 10px;background:var(--soft);border-radius:10px 10px 0 0;text-align:center}
.bin .bz{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.bin .put{margin:0 8px 8px;display:none}
.sort.selecting .bin .put,.sort.selecting .pool-put{display:inline-flex}
.pool-put{display:none;margin-top:6px}
.bin.over,.pool.over{border-color:var(--primary);background:var(--primary-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid #b9c3d6;background:var(--surface);border-radius:10px;padding:7px 12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:start;line-height:1.35;font-size:.96rem;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px rgba(36,83,194,.2)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);cursor:pointer}
.chip.bad{border-color:var(--bad);background:var(--bad-bg)}
.chip .m{font-weight:800}
.chip.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}

/* order */
.olist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.orow{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 8px;line-height:1.4}
.orow .pos{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);font-weight:700;display:flex;align-items:center;justify-content:center}
.orow .handle{flex:0 0 34px;height:40px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;color:var(--muted);border-radius:8px;user-select:none;-webkit-user-select:none;font-size:1.2rem;background:var(--soft);border:0}
.orow .otext{flex:1;font-size:.96rem}
.orow .arr{display:flex;flex-direction:column;gap:2px}
.orow .arr button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:24px;cursor:pointer;font-size:.75rem;line-height:1}
.orow .arr button:disabled{opacity:.3;cursor:default}
.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow.ok .pos{background:var(--ok);color:#fff}
.orow.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.orow.over{border-color:var(--primary);background:var(--primary-soft)}
.orow.dragging{opacity:.35}
.orow .lock{font-weight:800;color:var(--ok)}
.hintbox{margin-top:10px}

/* predict */
textarea.ta{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.saved-pred{background:var(--info-bg);border:1px solid var(--info-line);border-radius:12px;padding:12px 14px;white-space:pre-wrap}

/* end */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:12px 0}
.score .big{font-size:2.4rem;font-weight:800;color:var(--primary)}
.wrong-list{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.wrong-list li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
@media (max-width:560px){
  html{font-size:16px}
  .card{padding:16px 14px 20px}
  .card h2{font-size:1.25rem}
  .hero{flex-direction:column;text-align:center}
  .brand{font-size:.9rem}
  .tbtn .lbl{display:none}
}

/* =====================================================================
   שכבת עיצוב
   ===================================================================== */
:root{
  --bg:#f6f4ef; --surface:#fff; --ink:#18213a; --muted:#59627a; --line:#e4e1d8; --soft:#f2f0ea;
  --primary:#1f4fbf; --primary-dark:#173b91; --primary-soft:#e9effc;
  --navy:#16244f; --u:#1f4fbf; --us:#e9effc;
  --radius:18px; --shadow:0 1px 2px rgba(24,33,58,.05),0 8px 24px rgba(24,33,58,.07);
  --head:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
body{background-color:var(--bg);background-image:radial-gradient(rgba(24,33,58,.07) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,h4,.brand-t b,.kicker,.ucard .num{font-family:var(--head)}

/* top bar */
.topbar{background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:8px 18px;gap:14px;min-height:58px}
.brandbtn{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:12px;text-align:start}
.brandbtn:hover{background:var(--soft)}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.brand-t b{font-size:1.05rem;color:var(--navy);letter-spacing:.02em}
.brand-t span{font-size:.78rem;color:var(--muted)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:var(--us);color:var(--u);flex:0 0 28px}
.crumb > span:last-child{overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:8px}
.tbtn{border-radius:12px;border-color:var(--line);background:#fff}
.progress{height:4px;background:transparent}
.progress > div{background:var(--u);border-radius:0 4px 4px 0}

main{max-width:900px;padding:26px 18px 30px}

/* buttons */
.btn{border-radius:12px;font-weight:700;box-shadow:0 1px 0 rgba(24,33,58,.08),0 2px 6px rgba(31,79,191,.18);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 2px 0 rgba(24,33,58,.08),0 6px 14px rgba(31,79,191,.22)}
.btn.ghost{box-shadow:none;border-color:#c9d4ee}
.btn.ghost:hover:not(:disabled){box-shadow:none}
.btn.warn{box-shadow:none}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,#2f5fd0 0%,#1b3a8e 45%,#14234f 100%);border-radius:24px;padding:34px 34px;margin-bottom:30px;gap:24px;box-shadow:0 18px 40px rgba(20,35,79,.25)}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
.hero-text{position:relative;z-index:1;flex:1}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;margin-bottom:12px}
.hero h1{font-size:2.15rem;font-weight:800;margin:0 0 10px;line-height:1.2}
.hero p{font-size:1.05rem;opacity:.92;max-width:52ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero .btn{background:#fff;color:var(--navy);border-color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.hero .btn:hover{background:#eef3ff}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.1)}
.hero-art{position:relative;z-index:1;flex:0 0 210px;width:210px;height:auto}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 12px}
.sec-head h2{margin:0;font-size:1.3rem}
.sec-head span{color:var(--muted);font-size:.92rem}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ucard{border:1px solid var(--line);border-radius:18px;padding:18px;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ucard::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--u)}
.ucard:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:0 12px 28px rgba(24,33,58,.12)}
.ucard-top{display:flex;align-items:center;gap:10px}
.uicon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:13px;background:var(--us);color:var(--u);flex:0 0 42px}
.ucard .num{background:none;color:var(--u);padding:0;font-size:.85rem;font-weight:700}
.ucard h3{font-size:1.1rem;font-weight:700;margin:0;line-height:1.4;color:var(--ink)}
.ubar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:auto}
.ubar > div{height:100%;border-radius:99px;background:var(--u)}
.ucard .meta{padding-top:0}
.ucard.challenge{background:linear-gradient(160deg,#fffdf6,#fff6e0)}
.home-actions{justify-content:center;margin-top:28px}
.linkbtn.reset{color:var(--muted);font-size:.88rem}

/* ---------- unit screen ---------- */
.unit-head{margin:0 4px 10px;font-size:.88rem}
.steps-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}
.steps-dots span{width:8px;height:8px;border-radius:50%;background:#d8d4c9}
.steps-dots span.on{background:var(--u)}
.steps-dots span.cur{width:22px;border-radius:99px;background:var(--u)}
.steps-dots span.q{border-radius:2px}
.card{position:relative;border:1px solid var(--line);border-radius:22px;padding:30px 34px 32px;box-shadow:var(--shadow);overflow:hidden}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--u)}
.card.is-practice{background:linear-gradient(180deg,var(--us) 0,#fff 150px)}
.card h2{font-size:1.65rem;font-weight:800;line-height:1.3;color:var(--ink);margin-bottom:14px}
.kicker{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--u);font-size:.88rem;margin-bottom:8px}
.tag.practice{background:var(--u);color:#fff;font-size:.75rem;padding:2px 10px}
.txt{font-size:1.08rem;line-height:1.85;max-width:68ch}
.txt p{margin:0 0 12px}
.after{max-width:68ch;color:#2c3550}
.qprompt{font-family:var(--head);font-size:1.2rem;font-weight:600;line-height:1.55;margin-bottom:16px}
.goals{background:var(--us);border:1px solid color-mix(in srgb,var(--u) 18%,transparent);border-radius:16px;padding:16px 20px}
.goals h3{color:var(--u)}
.illus{background:#fbfaf7;border-color:var(--line);border-radius:16px}
.panel{border-radius:14px;background:var(--soft)}
.step-text{border-radius:14px;border-inline-start:4px solid var(--u)}
.fig{margin:20px 0 8px}

/* options & practice */
.opt{border-radius:14px;border-width:1.5px;padding:12px 14px;box-shadow:0 1px 0 rgba(24,33,58,.04)}
.opt:hover:not(:disabled){border-color:var(--u);background:var(--us)}
.opt .let{background:var(--us);color:var(--u);font-family:var(--head)}
.tf-item,.bin,.orow{border-radius:14px}
.tfb:hover:not(:disabled){border-color:var(--u)}
.chip[aria-pressed="true"]{border-color:var(--u);background:var(--us)}
.bin .bh{background:var(--us);color:var(--u);font-family:var(--head)}
.fb{border-radius:14px}

.idcard{border-color:var(--u);border-radius:18px}
.idcard .idh{background:var(--u)}
.idcard dt{color:var(--u)}
/* sticky bottom navigation */
.nav{position:sticky;bottom:0;z-index:10;margin-top:0;padding:14px 2px 16px;background:linear-gradient(to top,var(--bg) 70%,rgba(246,244,239,0))}
.nav .btn{min-width:120px}
.score .big{color:var(--u);font-family:var(--head)}

@media (max-width:640px){
  .hero{flex-direction:column-reverse;align-items:flex-start;text-align:start;padding:24px 20px}
  .hero h1{font-size:1.6rem}
  .hero-art{width:140px;flex-basis:auto;align-self:center}
  .card{padding:22px 18px 24px;border-radius:18px}
  .card h2{font-size:1.35rem}
  .brand-t span{display:none}
  .crumb{font-size:.82rem}
  .nav .btn{min-width:0;flex:1}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   תוכן הלומדה
   ---------------------------------------------------------------------
   כל התוכן נמצא כאן, בנפרד מהלוגיקה. אפשר לערוך טקסטים, שאלות ומשוב
   בלי לגעת בקוד שמתחת.

   סימון מונחים:   {{מונח}}  או  {{טקסט מוצג|מונח במילון}}
                   אפשר להוסיף שדה שלישי לאנגלית: {{טקסט|מונח|english}}
                   או "-" כדי לא להציג אנגלית: {{טקסט|מונח|-}}
                   בפעם הראשונה שמונח מופיע ביחידה, האנגלית נוספת אוטומטית.
   תגית הרחבה:     ext: true  (למסך או לשאלה)   או  [[ext]] בתוך טקסט.
   סוגי שאלות:     mcq (אמריקאית) · tf (נכון/לא נכון) · sort (מיון לסלים)
                   order (סידור רצף) · hotspot (נקודות חמות) · predict (ניבוי)
                   multi (סימון מרובה)
                   explain (שאלת הסבר פתוחה: model = תשובה לדוגמה, points = נקודות לבדיקה עצמית)
   בשאלות mcq:     ok: true מסמן את התשובה הנכונה. סדר האפשרויות מעורבב בתצוגה.
   ===================================================================== */

const GLOSSARY = {
  'חומצת אמינו': { en: 'amino acid', def: 'יחידת הבניין של חלבונים. חלבון הוא שרשרת של חומצות אמינו.' },

  'וריאנט': { en: 'variant', def: 'גרסה של חלבון שהרצף שלה שונה מהגרסה הטבעית במוטציה אחת או יותר.' },
  'הנדסת חלבונים': { en: 'protein engineering', def: 'שינוי מכוון של רצף החלבון כדי לשפר את תכונותיו או את פעילותו.' },
  'ספרייה': { name: 'ספרייה (של מוטנטים)', en: 'mutant library', def: 'אוסף גדול של וריאנטים של אותו גן, שכל אחד מהם נושא מוטציות שונות.' },
  'רצף שמור': { en: 'conserved sequence', def: 'עמדה או מקטע ברצף שבהם חומצת האמינו זהה במינים רבים.' },
  'חלבון רקומביננטי': { en: 'recombinant protein', def: 'חלבון שמיוצר במעבדה בתאים שהוחדר אליהם הגן המקודד לו.' },
  'פלסמיד': { en: 'plasmid', def: 'מולקולת DNA מעגלית וקטנה, שמשמשת "נשא" להחדרת גן לתאים.' },
  'טרנספקציה': { en: 'transfection', def: 'החדרת DNA, למשל פלסמיד, לתאים אאוקריוטים.' },
  'תאים אאוקריוטים': { en: 'eukaryotic cells', def: 'תאים שיש בהם גרעין ואברונים, כמו תאי אדם, תאי בעלי חיים ושמרים.' },

  'RCL': { en: 'Reactive Center Loop', def: 'לולאה גמישה וחשופה ב-AAT (חומצות אמינו 357–366), שמשמשת פיתיון לפרוטאזות.' },

  'אלסטין': { en: 'elastin', def: 'חלבון שנותן לרקמות גמישות, למשל בדפנות כלי הדם וברקמת הריאות.' },
  'ניוטרופיל': { en: 'neutrophil', def: 'תא דם לבן בלען, מהראשונים שמגיעים לאזור של זיהום.' },
  'מקרופאג': { en: 'macrophage', def: 'תא חיסון בלען שנמצא ברקמות, מזהה פתוגנים ומציג חלקים שלהם לתאי T.' },
  'ציטוקין': { en: 'cytokine', def: 'חלבון קטן שתאי מערכת החיסון משתמשים בו כדי לתקשר זה עם זה.' },
  'כמוקין': { en: 'chemokine', def: 'ציטוקין שמושך תאי חיסון אל אזור מסוים, כמו IL-8 שמושך ניוטרופילים.' },

  'דלקת כרונית': { en: 'chronic inflammation', def: 'דלקת שלא נכבית ופוגעת לאורך זמן ברקמה של הגוף עצמו.' },

  'נאדית': { name: 'נאדית (אלוואולה)', en: 'alveolus', def: 'שקיק אוויר זעיר בריאה, שבו מתרחש חילוף הגזים.' },
  'נפחת ריאות': { en: 'emphysema', def: 'הרס של דפנות הנאדיות, שמתמזגות לחללים גדולים, והריאה מאבדת גמישות.' },
  'COPD': { en: 'Chronic Obstructive Pulmonary Disease', def: 'מחלת ריאות חסימתית כרונית, שבה זרימת האוויר בדרכי הנשימה מוגבלת, ובעיקר קשה להוציא אוויר.' },
  'שחמת': { en: 'cirrhosis', def: 'פגיעה מתמשכת בכבד, שבה רקמה תקינה מוחלפת ברקמת צלקת.' },

  'פלסמה': { en: 'plasma', def: 'החלק הנוזלי של הדם, שמכיל חלבונים רבים, ביניהם AAT.' }
};

const UNITS = [

/* ============================ יחידה 0 ============================ */
{

    { title: `האבחנה`, fig: 'bloodTest',

    { title: `הטיפול`, fig: 'infusion',
      text: `יואב יקבל פעם בשבוע {{עירוי}} של AAT. החלבון מופק מ{{פלסמה}} של תורמי דם. הבעיה: מספר המטופלים בעולם עולה, ומאגרי הפלסמה לא מספיקים.` },

      prompt: `יואב חסר חלבון שנמצא בדם. איך לדעתך חוסר בחלבון בדם יכול לגרום לנזק לריאות?`,

<script>
/* =====================================================================
   לוגיקה: עזרים, שמירה, מונחים, גרירה ורכיבי תרגול לשימוש חוזר
   ===================================================================== */
'use strict';

/* ---------- DOM helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);

  return e;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function range(n) { return [...Array(n).keys()]; }

/* ---------- storage (localStorage with graceful fallback) ---------- */
const STORE_KEY = 'aat-lomda-v1';
let storageOK = true;
try { localStorage.setItem(STORE_KEY + '-test', '1'); localStorage.removeItem(STORE_KEY + '-test'); } catch (e) { storageOK = false; }
function freshStore() { return { units: {}, predict: '', reflect: '', explain: {}, challenge: null }; }
function loadStore() {
  try { const s = localStorage.getItem(STORE_KEY); if (s) { const o = JSON.parse(s); if (o && o.units) return Object.assign(freshStore(), o); } } catch (e) { }
  return freshStore();
}
let store = loadStore();
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { storageOK = false; } }

/* ---------- rich text: glossary terms, ext tag ---------- */
const TERM_RE = /\{\{([^}|]+)(?:\|([^}|]+))?(?:\|([^}|]*))?\}\}/g;
function rich(s) {
  if (s == null) return '';
  return String(s).replace(TERM_RE, (m, d, k, en) => {
    k = k || d;
    if (!GLOSSARY[k]) return d;
    let out = `<button type="button" class="term" data-term="${esc(k)}" aria-haspopup="dialog">${d}</button>`;
    if (en && en[0] === '+') out += `, <bdi dir="ltr">${en.slice(1)}</bdi>`;
    else if (en && en !== '-') out += ` (<bdi dir="ltr">${en}</bdi>)`;
    return out;

}
function plain(s) { return String(s).replace(TERM_RE, (m, d) => d).replace(/\[\[ext\]\]/g, '').replace(/<[^>]+>/g, ''); }

/* Mark the first occurrence of every term in a unit with its English name. */
function prepTerms(unit) {
  const seen = new Set();
  const walk = v => {
    if (typeof v === 'string') {
      return v.replace(TERM_RE, (m, d, k, en, off, str) => {
        k = k || d;
        const g = GLOSSARY[k];
        if (!g) return d;
        let e = '-';
        if (!seen.has(k)) {
          seen.add(k);
          if (en !== undefined) e = en;
          else if (/[֐-׿]/.test(k) && g.en) e = g.en;
          // already inside parentheses: add the English after a comma instead of nesting brackets
          if (e !== '-' && str[off - 1] === '(') e = '+' + e;
        }
        return `{{${d}|${k}|${e}}}`;
      });
    }
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === 'object') { const o = {}; for (const key in v) o[key] = (key === 'options' || key === 'items' && v.type) ? v[key] : walk(v[key]); return o; }
    return v;
  };
  return walk(unit);
}

/* Wrap Latin/number runs in <bdi> so English terms read correctly inside Hebrew. */
const LAT_RE = /[A-Za-z0-9αβ](?:[A-Za-z0-9αβ\-–]|\/(?=[A-Za-z])|\.(?=\d))*(?: (?=[A-Za-z0-9αβ])(?:[A-Za-z0-9αβ\-–]|\.(?=\d))+)*/g;

    acceptNode(n) {

      return /[A-Za-z0-9]/.test(n.nodeValue) && /[֐-׿]/.test(p.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;

    const s = n.nodeValue; LAT_RE.lastIndex = 0;
    if (!/[A-Za-zαβ]/.test(s)) return; LAT_RE.lastIndex = 0;

function richEl(tag, s, cls) { const e = h(tag, { class: cls, html: rich(s) }); return e; }

/* ---------- glossary popover ---------- */
let popEl = null, popReturn = null;
function closeTerm() { if (popEl) { popEl.remove(); popEl = null; if (popReturn) popReturn.focus(); popReturn = null; } }
function openTerm(btn) {
  closeTerm();
  const k = btn.dataset.term, g = GLOSSARY[k]; if (!g) return;
  popReturn = btn;
  popEl = h('div', { class: 'pop', role: 'dialog', 'aria-label': 'הגדרה: ' + k });
  popEl.innerHTML = `<div class="pop-h"><strong>${esc(g.name || k)}</strong>${g.en ? `<bdi dir="ltr" class="en">${esc(g.en)}</bdi>` : ''}</div><p>${esc(g.def)}</p>
    <div class="pop-a"><button type="button" class="linkbtn" data-act="gloss">למילון המלא</button><button type="button" class="xbtn" aria-label="סגירה">×</button></div>`;
  bidi(popEl);
  document.body.append(popEl);
  const r = btn.getBoundingClientRect(), pw = popEl.offsetWidth;
  let left = r.left + r.width / 2 - pw / 2 + window.scrollX;
  left = Math.max(8 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - pw - 8));
  let top = r.bottom + 8 + window.scrollY;
  if (r.bottom + popEl.offsetHeight + 16 > window.innerHeight && r.top > popEl.offsetHeight + 16) top = r.top + window.scrollY - popEl.offsetHeight - 8;
  popEl.style.left = left + 'px'; popEl.style.top = top + 'px';
  popEl.querySelector('.xbtn').onclick = closeTerm;
  popEl.querySelector('[data-act=gloss]').onclick = () => { popReturn = null; closeTerm(); go('#/glossary'); };
  popEl.querySelector('.xbtn').focus();
}
document.addEventListener('click', e => {
  const t = e.target.closest('.term');
  if (t) { e.preventDefault(); openTerm(t); return; }
  if (popEl && !popEl.contains(e.target)) { popReturn = null; closeTerm(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTerm(); });

/* ---------- pointer drag (mouse + touch + pen) ---------- */
function makeDraggable(handle, item, opt) {
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0 || (opt.canDrag && !opt.canDrag())) return;
    const sx = e.clientX, sy = e.clientY, rect = item.getBoundingClientRect();
    const offX = sx - rect.left, offY = sy - rect.top;
    let ghost = null, over = null, raf = 0, lastY = sy;
    try { handle.setPointerCapture(e.pointerId); } catch (_) { }
    const findTarget = (x, y) => { const el = document.elementFromPoint(x, y); return el ? opt.target(el) : null; };
    const scrollLoop = () => {
      if (!ghost) return;
      const m = 70; let d = 0;
      if (lastY < m) d = -Math.ceil((m - lastY) / 6); else if (lastY > innerHeight - m) d = Math.ceil((lastY - innerHeight + m) / 6);
      if (d) window.scrollBy(0, d);
      raf = requestAnimationFrame(scrollLoop);
    };

      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        ghost = item.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.removeAttribute('id');
        ghost.style.width = rect.width + 'px'; document.body.append(ghost);
        item.classList.add('dragging'); raf = requestAnimationFrame(scrollLoop);

      }
      ev.preventDefault();
      lastY = ev.clientY;
      ghost.style.left = (ev.clientX - offX) + 'px'; ghost.style.top = (ev.clientY - offY) + 'px';
      const t = findTarget(ev.clientX, ev.clientY);
      if (t !== over) { if (over) over.classList.remove('over'); over = t; if (over) over.classList.add('over'); }
    };

      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', end); handle.removeEventListener('pointercancel', end);
      cancelAnimationFrame(raf);

/* ---------- feedback box ---------- */
function fbBox() { return h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' }); }
function setFb(box, type, html, title) {
  const lbl = type === 'ok' ? 'תשובה נכונה' : type === 'bad' ? 'תשובה שגויה' : type === 'saved' ? 'נשמר' : 'מידע';
  if (type === 'saved') type = 'ok';
  const ic = type === 'ok' ? '✓' : type === 'bad' ? '✗' : 'i';
  box.className = 'fb show ' + type;
  box.innerHTML = `<span class="ic" aria-hidden="true">${ic}</span><div><span class="sr">${lbl}: </span>${title ? `<span class="ft">${title}</span>` : ''}${rich(html)}</div>`;
  bidi(box);
}
function revealBtn(onClick) { return h('button', { type: 'button', class: 'btn ghost small', onclick: onClick }, 'הצג תשובה'); }

/* =====================================================================
   Practice components. Each gets (q, ctx) and returns an element.
   ctx.record(key, firstTryCorrect)  records a score once per key.
   ctx.order(key, n, notIdentity)    returns a cached shuffled order.
   ===================================================================== */
const COMP = {};

/* --- multiple choice --- */
COMP.mcq = (q, ctx) => {
  const w = h('div', { class: 'comp mcq' });
  const order = ctx.order(q.id, q.options.length);
  const list = h('div', { class: 'opts', role: 'group', 'aria-label': 'אפשרויות תשובה' });
  const fb = fbBox(), extra = h('div', { class: 'row-btns' });
  const btns = []; let wrong = 0, done = false;
  const letters = 'אבגדהו';
  order.forEach((oi, pos) => {
    const o = q.options[oi];
    const b = h('button', { type: 'button', class: 'opt' },
      h('span', { class: 'let', 'aria-hidden': 'true' }, letters[pos]),
      h('span', { class: 'otx', html: esc(o.t) }),
      h('span', { class: 'mark', 'aria-hidden': 'true' }));
    b.addEventListener('click', () => pick(oi));
    btns[oi] = b; list.append(b);
  });
  const finish = () => { done = true; btns.forEach(b => b.disabled = true); extra.innerHTML = ''; };
  function pick(oi) {
    if (done) return;
    const o = q.options[oi], b = btns[oi];
    if (o.ok) {
      b.classList.add('correct'); b.querySelector('.mark').textContent = '✓'; b.querySelector('.mark').className = 'mark mark-ok';
      setFb(fb, 'ok', o.fb); ctx.record(q.id, wrong === 0); finish();
    } else {
      wrong++; b.classList.add('wrong'); b.disabled = true; b.setAttribute('aria-label', 'שגוי: ' + o.t);
      b.querySelector('.mark').textContent = '✗'; b.querySelector('.mark').className = 'mark mark-bad';
      setFb(fb, 'bad', o.fb + ' <strong>נסו שוב.</strong>');
      if (wrong === 1) ctx.record(q.id, false);
      if (wrong >= 2 && !extra.firstChild) extra.append(revealBtn(reveal));
    }
  }
  function reveal() {
    const ci = q.options.findIndex(o => o.ok), b = btns[ci];
    b.classList.add('correct'); b.querySelector('.mark').textContent = '✓'; b.querySelector('.mark').className = 'mark mark-ok';
    setFb(fb, 'info', q.options[ci].fb, 'התשובה הנכונה: ' + esc(q.options[ci].t)); finish();
  }
  w.append(list, fb, extra);
  return w;
};

/* --- true / false --- */
COMP.tf = (q, ctx) => {
  const w = h('div', { class: 'comp tf tf-list' });
  q.items.forEach((it, i) => {
    const key = q.id + '_' + i;
    const row = h('div', { class: 'tf-item' });
    const fb = fbBox(); let tried = false, done = false;
    const mk = (val, label) => {
      const b = h('button', { type: 'button', class: 'tfb' }, label);
      b.addEventListener('click', () => {
        if (done) return;
        if (val === it.ans) {
          done = true; b.classList.add('correct'); b.textContent = '✓ ' + label;
          bT.disabled = bF.disabled = true;
          setFb(fb, 'ok', it.fb, (it.ans ? 'נכון.' : 'לא נכון.') + ' ');
          ctx.record(key, !tried);
        } else {
          tried = true; b.classList.add('wrong'); b.textContent = '✗ ' + label; b.disabled = true;
          setFb(fb, 'bad', 'זו לא התשובה הנכונה. קראו שוב את ההיגד ונסו שוב.');
          ctx.record(key, false);
        }
      });
      return b;
    };
    const bT = mk(true, 'נכון'), bF = mk(false, 'לא נכון');
    row.append(h('div', { class: 'stmt', html: esc(it.t) }), h('div', { class: 'tf-btns', role: 'group', 'aria-label': 'נכון או לא נכון' }, bT, bF), fb);
    w.append(row);
  });
  return w;
};

/* --- sort into bins --- */
COMP.sort = (q, ctx) => {
  const n = q.items.length;
  const w = h('div', { class: 'comp sort' });
  const place = Array(n).fill(-1), status = Array(n).fill(null);
  let selected = null, checks = 0, solved = false;
  const pool = h('div', { class: 'pool', 'data-bin': '-1', 'aria-label': 'פריטים למיון' });
  const poolPut = h('button', { type: 'button', class: 'btn ghost small pool-put' }, 'החזרה לרשימה');
  const bins = h('div', { class: 'bins n' + q.bins.length });
  const zones = q.bins.map((name, bi) => {
    const zone = h('div', { class: 'bz' });
    const put = h('button', { type: 'button', class: 'btn ghost small put' }, 'העברה לכאן');
    const bin = h('div', { class: 'bin', 'data-bin': String(bi), role: 'group', 'aria-label': 'סל: ' + name }, h('div', { class: 'bh' }, name), zone, put);
    put.addEventListener('click', e => { e.stopPropagation(); if (selected != null) move(selected, bi); });
    bin.addEventListener('click', e => { if (e.target.closest('.chip')) return; if (selected != null) move(selected, bi); });
    bins.append(bin); return zone;
  });
  pool.addEventListener('click', e => { if (e.target.closest('.chip')) return; if (selected != null) move(selected, -1); });
  poolPut.addEventListener('click', () => { if (selected != null) move(selected, -1); });
  const order = ctx.order(q.id, n);
  const chips = q.items.map((it, i) => {
    const c = h('button', { type: 'button', class: 'chip', 'aria-pressed': 'false' }, h('span', { class: 'm', 'aria-hidden': 'true' }), h('span', { class: 't' }, it.t));
    c.addEventListener('click', () => {
      if (c.dataset.dragged) return;
      if (status[i]) showItem(i);
      if (status[i] === 'ok' || solved) return;
      selected = selected === i ? null : i; layout();
    });
    makeDraggable(c, c, {
      canDrag: () => !solved && status[i] !== 'ok',
      target: el => { const z = el.closest('[data-bin]'); return z && w.contains(z) ? z : null; },
      onDrop: t => move(i, +t.dataset.bin)
    });
    return c;
  });
  const itemFb = fbBox(), fb = fbBox();
  const checkBtn = h('button', { type: 'button', class: 'btn', onclick: check }, 'בדיקה');
  const extra = h('span');
  function showItem(i) {
    if (status[i] === 'ok') setFb(itemFb, 'ok', q.items[i].fb, esc(q.items[i].t) + ': ');
    else setFb(itemFb, 'bad', 'הפריט הזה לא נמצא בסל המתאים. העבירו אותו לסל אחר.', esc(q.items[i].t) + ': ');
  }
  function move(i, b) {
    if (solved || status[i] === 'ok') return;
    place[i] = b; status[i] = null; selected = null; layout();
    chips[i].focus();
  }
  function layout() {
    order.forEach(i => {
      const c = chips[i];
      (place[i] < 0 ? pool : zones[place[i]]).append(c);
      c.setAttribute('aria-pressed', selected === i ? 'true' : 'false');
      c.classList.toggle('ok', status[i] === 'ok'); c.classList.toggle('bad', status[i] === 'bad');
      c.querySelector('.m').textContent = status[i] === 'ok' ? '✓' : status[i] === 'bad' ? '✗' : '';
      const where = place[i] < 0 ? 'לא מוין' : 'בסל ' + q.bins[place[i]];
      c.setAttribute('aria-label', q.items[i].t + ', ' + where + (status[i] === 'ok' ? ', נכון' : status[i] === 'bad' ? ', לא במקום' : ''));
    });
    pool.classList.toggle('empty', place.every(p => p >= 0));
    w.classList.toggle('selecting', selected != null);
    checkBtn.disabled = solved || place.some(p => p < 0);
  }
  function check() {
    checks++; let bad = 0;
    q.items.forEach((it, i) => { if (place[i] === it.bin) status[i] = 'ok'; else { status[i] = 'bad'; bad++; } });
    if (checks === 1) ctx.record(q.id, bad === 0);
    selected = null;
    if (bad === 0) { solved = true; setFb(fb, 'ok', 'כל הפריטים במקומם. לחצו על פריט כדי לקרוא את ההסבר.', 'כל הכבוד! '); extra.innerHTML = ''; }
    else {
      setFb(fb, 'bad', `${bad === 1 ? 'פריט אחד לא נמצא במקום (מסומן' : bad + ' פריטים לא נמצאים במקום (מסומנים'} ב-✗).לחצו על פריט כדי לקרוא עליו, העבירו את הפריטים השגויים ובדקו שוב.`);
      if (checks >= 2 && !extra.firstChild) extra.append(revealBtn(reveal));
    }
    itemFb.className = 'fb'; layout();
  }
  function reveal() {
    q.items.forEach((it, i) => { place[i] = it.bin; status[i] = 'ok'; });
    solved = true; selected = null; extra.innerHTML = ''; layout();
    setFb(fb, 'info', 'כך נראה המיון הנכון. לחצו על כל פריט כדי לקרוא את ההסבר.');
  }
  w.append(h('div', { class: 'fig-cap', style: 'text-align:start;margin-bottom:6px' }, 'גררו פריט לסל, או לחצו על פריט ואז על הסל.'),
    pool, poolPut, bins, itemFb, h('div', { class: 'row-btns' }, checkBtn, extra), fb);
  layout();
  return w;
};

/* --- order a sequence --- */
COMP.order = (q, ctx) => {
  const n = q.steps.length;
  const w = h('div', { class: 'comp order' });
  const arr = ctx.order(q.id, n, true).slice();
  const locked = Array(n).fill(false), marks = Array(n).fill(null);
  let checks = 0, solved = false;
  const list = h('ol', { class: 'olist', 'aria-label': 'רשימת שלבים לסידור' });
  const fb = fbBox(), hintBox = h('div', { class: 'hintbox' }), extra = h('span');
  const checkBtn = h('button', { type: 'button', class: 'btn', onclick: check }, 'בדיקה');
  const free = () => range(n).filter(p => !locked[p]);
  function moveTo(from, to) {
    if (from === to || locked[from] || locked[to]) return;
    const fr = free(), items = fr.map(p => arr[p]);
    const [x] = items.splice(fr.indexOf(from), 1); items.splice(fr.indexOf(to), 0, x);
    fr.forEach((p, k) => arr[p] = items[k]);
    marks.fill(null); layout();
  }
  function step(p, dir) {
    const fr = free(), k = fr.indexOf(p), t = fr[k + dir];
    if (t == null) return;
    [arr[p], arr[t]] = [arr[t], arr[p]]; marks.fill(null); layout();
    const btn = list.querySelector(`.orow[data-pos="${t}"] .arr button:${dir < 0 ? 'first-child' : 'last-child'}`);
    (btn && !btn.disabled ? btn : list.querySelector(`.orow[data-pos="${t}"] .handle`))?.focus();
  }
  function layout() {
    list.innerHTML = '';
    const fr = free();
    arr.forEach((si, p) => {
      const row = h('li', { class: 'orow' + (locked[p] ? ' ok' : marks[p] === 'bad' ? ' bad' : ''), 'data-pos': String(p) });
      const txt = h('span', { class: 'otext', html: esc(q.steps[si]) });
      if (locked[p]) {
        row.append(h('span', { class: 'pos' }, String(p + 1)), h('span', { class: 'lock', 'aria-hidden': 'true' }, '✓'), txt, h('span', { class: 'sr' }, 'במקום הנכון'));
      } else {
        const handle = h('button', { type: 'button', class: 'handle', 'aria-label': 'גרירת השלב: ' + plain(q.steps[si]) }, '⠿');
        const k = fr.indexOf(p);
        const up = h('button', { type: 'button', 'aria-label': 'הזזה למעלה', onclick: () => step(p, -1) }, '▲');
        const dn = h('button', { type: 'button', 'aria-label': 'הזזה למטה', onclick: () => step(p, 1) }, '▼');
        up.disabled = solved || k === 0; dn.disabled = solved || k === fr.length - 1;
        row.append(h('span', { class: 'pos' }, String(p + 1)), handle, txt);
        if (marks[p] === 'bad') row.append(h('span', { class: 'mark-bad', 'aria-label': 'לא במקום' }, '✗'));
        row.append(h('span', { class: 'arr' }, up, dn));
        makeDraggable(handle, row, {
          canDrag: () => !solved,
          target: el => { const r = el.closest('.orow'); return r && list.contains(r) && !locked[+r.dataset.pos] ? r : null; },
          onDrop: t => moveTo(p, +t.dataset.pos)
        });
      }
      list.append(row);
    });
    bidi(list);
    checkBtn.disabled = solved;
  }
  function check() {
    checks++; let bad = 0;
    arr.forEach((si, p) => { if (si === p) { locked[p] = true; marks[p] = null; } else { marks[p] = 'bad'; bad++; } });
    if (checks === 1) ctx.record(q.id, bad === 0);
    if (bad === 0) { solved = true; extra.innerHTML = ''; setFb(fb, 'ok', 'כל השלבים בסדר הנכון.', 'מצוין! '); }
    else {
      const good = n - bad;
      setFb(fb, 'bad', `${good === 0 ? 'אף שלב עוד לא במקומו' : good === 1 ? 'שלב אחד במקומו וננעל בירוק' : good + ' שלבים במקומם וננעלו בירוק'}. סדרו מחדש את השלבים המסומנים ב-✗ ובדקו שוב.`);
      if (checks >= 2 && !extra.firstChild) extra.append(revealBtn(reveal));
    }
    layout();
  }
  function reveal() {
    range(n).forEach(p => { arr[p] = p; locked[p] = true; marks[p] = null; });
    solved = true; extra.innerHTML = ''; layout();
    setFb(fb, 'info', 'כך נראה הסדר הנכון.');
  }
  const btns = h('div', { class: 'row-btns' }, checkBtn);
  if (q.hint) btns.append(h('button', { type: 'button', class: 'btn ghost', onclick: () => setFb(hintBox, 'info', q.hint, 'רמז: ') }, 'רמז'));
  btns.append(extra);
  w.append(list, hintBox, btns, fb);
  layout();
  return w;
};

/* --- hotspot question (click the right region of a figure) --- */
COMP.hotspot = (q, ctx) => {
  const w = h('div', { class: 'comp hotspotq' });
  const fb = fbBox(), extra = h('div', { class: 'row-btns' });
  let wrong = 0, done = false, api = null;
  const figWrap = h('div', { class: 'fig' });
  api = FIG[q.fig](figWrap, q.figData || {}, { mode: 'question', onPick: pick });
  function pick(id) {
    if (done) return;
    if (id === q.correct) {
      done = true; api.mark(id, 'correct'); setFb(fb, 'ok', q.fbOk, 'נכון! '); ctx.record(q.id, wrong === 0); extra.innerHTML = '';
    } else {
      wrong++; api.mark(id, 'wrong'); setFb(fb, 'bad', q.fbBad + ' <strong>נסו שוב.</strong>');
      if (wrong === 1) ctx.record(q.id, false);
      if (wrong >= 2 && !extra.firstChild) extra.append(revealBtn(() => { done = true; api.mark(q.correct, 'correct'); setFb(fb, 'info', q.fbOk, 'האזור הנכון מסומן בירוק באיור: ה-RCL. '); extra.innerHTML = ''; }));
    }
  }
  w.append(figWrap, fb, extra);
  return w;
};

/* --- prediction (free text, saved, no checking) --- */
COMP.predict = (q, ctx) => {
  const w = h('div', { class: 'comp predict' });
  const ta = h('textarea', { class: 'ta', 'aria-label': 'הניבוי שלך', placeholder: 'כתבו כאן את הניבוי שלכם…' });
  ta.value = store.predict || '';
  const fb = fbBox();
  const save = h('button', { type: 'button', class: 'btn', onclick: () => {
    if (!ta.value.trim()) { setFb(fb, 'info', 'כתבו ניבוי קצר לפני השמירה. אין כאן תשובה נכונה או שגויה.'); return; }
    store.predict = ta.value.trim(); saveStore(); setFb(fb, 'saved', q.fb);
  } }, 'שמירת הניבוי');
  if (store.predict) setFb(fb, 'saved', q.fb);
  w.append(ta, h('div', { class: 'row-btns' }, save), fb);
  return w;
};

/* --- open explanation: write, then compare with a model answer and self-check --- */
COMP.explain = (q, ctx) => {
  const w = h('div', { class: 'comp explain' });
  store.explain = store.explain || {};
  const ta = h('textarea', { class: 'ta', 'aria-label': 'התשובה שלך', placeholder: 'כתבו כאן הסבר במשפטים מלאים…' });
  ta.value = store.explain[q.id] || '';
  const fb = fbBox(), out = h('div');
  const show = () => {
    out.innerHTML = '';
    const model = h('div', { class: 'panel', style: 'background:var(--ok-bg);border:1px solid var(--ok-line)' }, h('h4', {}, 'תשובה לדוגמה'), h('p', { html: rich(q.model) }));
    const count = h('p', { style: 'font-weight:700;margin:8px 0 0', 'aria-live': 'polite' });
    const list = h('div', { class: 'checklist' });
    const boxes = q.points.map(pt => {
      const cb = h('input', { type: 'checkbox' });
      cb.addEventListener('change', upd);
      list.append(h('label', { class: 'sw', style: 'align-items:flex-start' }, cb, h('span', { html: rich(pt) })));
      return cb;
    });
    function upd() {
      const n = boxes.filter(b => b.checked).length;
      count.textContent = `כללתם ${n} מתוך ${boxes.length} נקודות.` + (n === boxes.length ? ' תשובה מלאה!' : n ? ' הוסיפו לתשובה את מה שחסר.' : '');
    }
    out.append(model, h('h4', { style: 'margin:14px 0 6px' }, 'בדקו את התשובה שלכם: סמנו כל נקודה שכללתם'), list, count);
    upd(); bidi(out);
  };
  const send = h('button', { type: 'button', class: 'btn', onclick: () => {
    if (ta.value.trim().length < 15) { setFb(fb, 'info', 'כתבו קודם הסבר משלכם, ורק אחר כך השוו לתשובה לדוגמה.'); return; }
    store.explain[q.id] = ta.value.trim(); saveStore(); fb.className = 'fb'; show();
  } }, 'הצגת תשובה לדוגמה');
  w.append(ta, h('div', { class: 'row-btns' }, send), fb, out);
  return w;
};

/* --- multi select (mark all that apply) --- */
COMP.multi = (q, ctx) => {
  const w = h('div', { class: 'comp multi' });
  const order = ctx.order(q.id, q.items.length);
  const sel = Array(q.items.length).fill(false);
  let checks = 0, done = false;
  const box = h('div', { class: 'pool', style: 'border-style:solid', role: 'group', 'aria-label': 'ציטוקינים' });
  const chips = [];
  order.forEach(i => {
    const c = h('button', { type: 'button', class: 'chip', style: 'cursor:pointer;touch-action:auto', 'aria-pressed': 'false' }, h('span', { class: 'm', 'aria-hidden': 'true' }, '☐'), h('span', {}, q.items[i].t));
    c.addEventListener('click', () => { if (done) return; sel[i] = !sel[i]; c.setAttribute('aria-pressed', String(sel[i])); c.querySelector('.m').textContent = sel[i] ? '☑' : '☐'; });
    chips[i] = c; box.append(c);
  });
  const fb = fbBox(), extra = h('span');
  const showAll = () => q.items.forEach((it, i) => { const c = chips[i]; c.classList.add(it.ok ? 'ok' : 'bad'); c.querySelector('.m').textContent = it.ok ? '✓ מוריד' : '✗ מעלה'; c.disabled = true; });
  const checkBtn = h('button', { type: 'button', class: 'btn', onclick: () => {
    if (done) return;
    checks++;
    const ok = q.items.every((it, i) => !!it.ok === sel[i]);
    if (checks === 1) ctx.record(q.id, ok);
    if (ok) { done = true; showAll(); setFb(fb, 'ok', q.fb, 'נכון! '); checkBtn.disabled = true; extra.innerHTML = ''; }
    else { setFb(fb, 'bad', (q.fbBad || 'הבחירה עוד לא מדויקת.') + ' <strong>נסו שוב.</strong>'); if (checks >= 2 && !extra.firstChild) extra.append(revealBtn(() => { done = true; showAll(); setFb(fb, 'info', q.fb); checkBtn.disabled = true; extra.innerHTML = ''; })); }
  } }, 'בדיקה');
  w.append(box, h('div', { class: 'row-btns' }, checkBtn, extra), fb);
  return w;
};
</script>
<script>
/* =====================================================================
   איורים (SVG) ורכיבים אינטראקטיביים של מסכי התוכן
   כל האיורים מצוירים כאן מחדש. הטקסטים שלהם מגיעים מקובץ התוכן.

const FIG = {};
const SVGNS = 'http://www.w3.org/2000/svg';
function S(vb, inner, label) { return `<svg xmlns="${SVGNS}" viewBox="${vb}" class="fig-svg" role="img" aria-label="${esc(label || '')}" font-family="Heebo, Arial, sans-serif">${inner}</svg>`; }

}
function ill(el, svg, cap) { const d = h('div', { class: 'illus', html: svg }); el.append(d); if (cap) el.append(h('div', { class: 'fig-cap', html: cap })); return d; }

/* small shared drawings */
const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

  <radialGradient id="gEla" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#f3eafb"/><stop offset="1" stop-color="#a47ac9"/></radialGradient>
  <radialGradient id="gElaOff" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#f2f2f2"/><stop offset="1" stop-color="#b3aebb"/></radialGradient>

  <radialGradient id="gInfl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e53935" stop-opacity=".75"/><stop offset="1" stop-color="#e53935" stop-opacity="0"/></radialGradient>

  <radialGradient id="gT" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#b3c7f2"/></radialGradient>
  <linearGradient id="gTissue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbefdc"/><stop offset="1" stop-color="#fdf8f0"/></linearGradient>
  <linearGradient id="gLumen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cfcb"/><stop offset=".5" stop-color="#fbe4e1"/><stop offset="1" stop-color="#f7cfcb"/></linearGradient>
</defs></svg>`;
(() => { const d = document.createElement('div'); d.id = 'aat-defs'; d.innerHTML = DEFS; document.body.prepend(d); })();

/* Cells and molecules, drawn once and reused. Each is centred on (x, y). */
const neut = (x, y, r = 12) => `<g transform="translate(${x} ${y}) scale(${r / 12})"><circle r="12" fill="url(#gNeut)" stroke="#8e5bb5" stroke-width="1.5"/>${[[-7, 6], [6, 7], [8, -3], [-2, 9], [-9, -3], [3, -9], [-5, -8]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r=".9" fill="#b394d1"/>`).join('')}<path d="M-5,-2 L0,4 L5,-3" stroke="#6f3596" stroke-width="1.6" fill="none"/><ellipse cx="-5.5" cy="-2.5" rx="3.6" ry="3" fill="#6f3596"/><ellipse cx="0" cy="4.5" rx="3.6" ry="3" fill="#6f3596"/><ellipse cx="5.5" cy="-3" rx="3.4" ry="3" fill="#6f3596"/></g>`;
const macro = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22,-4 C-30,-10 -26,-21 -16,-18 C-12,-27 0,-28 6,-22 C14,-28 26,-22 22,-12 C32,-8 30,6 22,8 C26,18 14,26 6,20 C0,28 -14,26 -14,18 C-24,20 -30,8 -22,-4Z" fill="url(#gMac)" stroke="#b07a3a" stroke-width="1.6"/><path d="M-9,-7 C-3,-13 8,-9 6,-1 C4,5 -3,3 -5,8 C-9,11 -15,-2 -9,-7Z" fill="#c38f57"/><circle cx="12" cy="7" r="3.5" fill="#fffaf2" stroke="#d6ad80"/><circle cx="-12" cy="10" r="2.5" fill="#fffaf2" stroke="#d6ad80"/></g>`;
const mast = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><circle r="16" fill="url(#gMast)" stroke="#4a78b5" stroke-width="1.6"/><ellipse cx="-2" cy="1" rx="5.5" ry="4.5" fill="#9cb6db"/>${[[-9, -7], [-3, -11], [4, -10], [10, -4], [11, 3], [7, 9], [0, 11], [-7, 9], [-12, 1], [5, 3], [6, -4], [-8, 4]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="1.9" fill="#36598f"/>`).join('')}</g>`;
const bact = (x, y, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M12,0 q4,-4 8,0 t8,0" stroke="#4b7a1f" stroke-width="1" fill="none"/><rect x="-12" y="-5.5" width="24" height="11" rx="5.5" fill="url(#gBact)" stroke="#4b7a1f" stroke-width="1.3"/><path d="M-6,0 h10" stroke="#4b7a1f" stroke-width="1" opacity=".45"/></g>`;
const rbc = (x, y, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="11" ry="7" fill="url(#gRbc)"/><ellipse rx="5" ry="3" fill="#ea8c86" opacity=".85"/></g>`;
const ELA_PATH = 'M-3,13 C-12,13 -17,5 -16,-3 C-15,-12 -7,-17 2,-16 C11,-15 17,-8 16,1 C15,8 10,13 4,13 L1,6 Z';
const ela = (x, y, s = 1, rot = 0, off = false) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="${ELA_PATH}" fill="url(#${off ? 'gElaOff' : 'gEla'})" stroke="${off ? '#7d7686' : '#5e2a85'}" stroke-width="1.6"/></g>`;
const AAT_PATH = 'M-15,-4 C-15,-13 -5,-16 3,-15 C12,-14 17,-6 15,4 C13,12 4,16 -5,14 C-13,12 -15,4 -15,-4Z';
const aatBlob = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-5,-14 C-8,-25 -2,-28 0,-28 C2,-28 8,-25 5,-14" fill="none" stroke="#1f6fb2" stroke-width="2.4" stroke-linecap="round"/><path d="${AAT_PATH}" fill="url(#gAAT)" stroke="#1f6fb2" stroke-width="1.7"/><text y="3.5" text-anchor="middle" font-size="8" font-weight="800" fill="#1f5f99">AAT</text></g>`;
/* AAT–elastase complex: loop inserted, inactive elastase held at the far pole. */
const cplx = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="${AAT_PATH}" fill="url(#gAAT)" stroke="#1f6fb2" stroke-width="1.7"/><text y="3" text-anchor="middle" font-size="8" font-weight="800" fill="#1f5f99">AAT</text><g transform="translate(0 27) rotate(180) scale(.85)"><path d="${ELA_PATH}" fill="url(#gElaOff)" stroke="#7d7686" stroke-width="1.8"/></g></g>`;
/* DNA double helix: two antiparallel strands wound around one axis, base pairs between them.
   The back half of each turn is drawn paler, so the strands read as winding around each other. */
const helix = (cx, y0, h, A = 14, P = 48, o = {}) => {
  const c1 = o.c1 || '#2453c2', c2 = o.c2 || '#e4572e', w = o.w || 3.5, N = 80;
  const seg = (phase, front) => {
    let d = '', on = false;
    for (let i = 0; i <= N; i++) {
      const t = 2 * Math.PI * (h * i / N) / P + phase, y = y0 + h * i / N, x = cx + A * Math.sin(t);
      const f = Math.cos(t) >= 0;
      if (f === front) { d += (on ? ' L' : ' M') + x.toFixed(1) + ',' + y.toFixed(1); on = true; } else on = false;
    }
    return d;
  };
  let rungs = '', k = 0;
  const step = P / 8;
  for (let y = y0 + step / 2; y < y0 + h; y += step) {
    const s = Math.sin(2 * Math.PI * (y - y0) / P), x = A * s;
    if (Math.abs(s) < 0.3) continue;
    const hi = o.mark != null && Math.abs(y - (y0 + o.mark)) < step / 2;
    rungs += `<line x1="${(cx - x).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx + x).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${hi ? o.markColor || '#f0a020' : '#aab4c6'}" stroke-width="${hi ? 5 : 2.2}" stroke-linecap="round"/>`;
    k++;
  }
  return `<g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="${seg(0, false)}" stroke="${c1}" stroke-width="${w}" opacity=".4"/><path d="${seg(Math.PI, false)}" stroke="${c2}" stroke-width="${w}" opacity=".4"/>
    ${rungs}
    <path d="${seg(0, true)}" stroke="${c1}" stroke-width="${w}"/><path d="${seg(Math.PI, true)}" stroke="${c2}" stroke-width="${w}"/></g>`;
};
const LIVER_PATH = 'M0,22 C8,2 58,-8 110,2 C132,6 136,22 122,33 C98,50 62,63 30,66 C10,68 -5,50 0,22Z';
const liver = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="${LIVER_PATH}" fill="url(#gLiver)" stroke="#6b2a12" stroke-width="1.5"/><path d="M70,0 C66,20 60,40 52,62" stroke="#6b2a12" stroke-width="1.2" fill="none" opacity=".6"/><ellipse cx="78" cy="58" rx="9" ry="6" fill="#7cb342" stroke="#4b7a1f" transform="rotate(-20 78 58)"/></g>`;
const arrow = (x1, y1, x2, y2, c = '#566079') => { const a = Math.atan2(y2 - y1, x2 - x1), L = 9; return `<g stroke="${c}" stroke-width="2.5" fill="${c}" stroke-linecap="round"><line x1="${x1}" y1="${y1}" x2="${x2 - Math.cos(a) * 4}" y2="${y2 - Math.sin(a) * 4}"/><polygon stroke="none" points="${x2},${y2} ${x2 - L * Math.cos(a - .45)},${y2 - L * Math.sin(a - .45)} ${x2 - L * Math.cos(a + .45)},${y2 - L * Math.sin(a + .45)}"/></g>`; };
const BEAD = ['#e4572e', '#2453c2', '#3a9a57', '#d39b16', '#7b3fa0', '#17a2b8', '#e4572e', '#3a9a57', '#2453c2', '#d39b16'];

/* ---------- generic hotspot figure ---------- */
function hotspotFig(el, svg, spots, opts) {
  opts = opts || {};
  const q = opts.mode === 'question';
  const wrap = h('div', { class: 'illus', html: svg }); el.append(wrap);
  const regions = {};
  [...wrap.querySelectorAll('[data-spot]')].forEach((g, ix) => {
    const id = g.dataset.spot; regions[id] = g;
    g.classList.add('spot'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    const sp = (spots || []).find(s => s.id === id);
    g.setAttribute('aria-label', q ? 'אזור ' + (ix + 1) + ' באיור' : (sp ? plain(sp.title) : id));

  }

}

FIG.beads = el => {
  const n = 10;
  const line = range(n).map(i => [40 + i * 35, 70]);
  const fold = [[170, 120], [200, 105], [230, 118], [240, 148], [215, 168], [185, 165], [160, 150], [150, 180], [180, 196], [215, 196]];
  const wrap = ill(el, S('0 0 400 220', `
    <rect width="400" height="220" rx="14" fill="#f8fafd"/>
    <polyline class="bl" fill="none" stroke="#8a95ab" stroke-width="4" stroke-linejoin="round"/>
    ${range(n).map(i => `<circle class="bd" r="12" fill="${BEAD[i]}" stroke="#fff" stroke-width="2"/>`).join('')}
    <text class="cap" x="200" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#535d73"></text>
  `, 'שרשרת של חומצות אמינו שמתקפלת למבנה'));
  const bds = wrap.querySelectorAll('.bd'), pl = wrap.querySelector('.bl'), cap = wrap.querySelector('.cap');
  let folded = false, raf = 0;
  const draw = t => {
    const pts = range(n).map(i => [line[i][0] + (fold[i][0] - line[i][0]) * t, line[i][1] + (fold[i][1] - line[i][1]) * t]);
    pts.forEach((p, i) => { bds[i].setAttribute('cx', p[0]); bds[i].setAttribute('cy', p[1]); });
    pl.setAttribute('points', pts.map(p => p.join(',')).join(' '));
  };
  const btn = h('button', { type: 'button', class: 'btn ghost small' }, 'קפלו את השרשרת');
  const set = () => { cap.textContent = folded ? 'מבנה מקופל: הוא שקובע את התפקוד' : 'רצף: שרשרת של חומצות אמינו'; btn.textContent = folded ? 'פרשו את השרשרת' : 'קפלו את השרשרת'; };
  btn.addEventListener('click', () => {
    folded = !folded; set(); cancelAnimationFrame(raf);
    const t0 = performance.now(), from = folded ? 0 : 1, to = folded ? 1 : 0;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = now => { let k = reduce ? 1 : Math.min(1, (now - t0) / 900); k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; draw(from + (to - from) * k); if (k < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  });
  draw(0); set();
  el.append(h('div', { class: 'row-btns', style: 'justify-content:center' }, btn));
};

FIG.balance = (el, data) => {
  const F = [
    { k: 'inf', label: 'זיהום חיידקי', cls: 'trig', on: true },
    { k: 'il8', label: 'IL-8', cls: 'pro', on: true, side: 'pro', w: 1 },
    { k: 'tnf', label: 'TNFα', cls: 'pro', on: true, side: 'pro', w: 1 },
    { k: 'il10', label: 'IL-10', cls: 'anti', side: 'anti', w: 1 },
    { k: 'aat', label: 'AAT', cls: 'anti', side: 'anti', w: 1 },
    { k: 'smoke', label: 'עישון', cls: 'pro', side: 'pro', w: 2 }
  ];
  const st = {}; F.forEach(f => st[f.k] = !!f.on);
  const wrap = ill(el, S('0 0 360 230', `
    <rect width="360" height="230" rx="14" fill="#f8fafd"/>
    ${T(300, 24, 'מקדמי דלקת', { fs: 13, fw: 800, c: '#a3241a' })}${T(60, 24, 'נוגדי דלקת', { fs: 13, fw: 800, c: '#156b3c' })}
    <polygon points="180,118 150,200 210,200" fill="#8a95ab"/><rect x="120" y="200" width="120" height="10" rx="5" fill="#8a95ab"/>
    <g class="beam" style="transform-box:view-box;transform-origin:180px 118px;transition:transform .6s"><rect x="52" y="114" width="256" height="8" rx="4" fill="#535d73"/><circle cx="180" cy="118" r="6" fill="#1b2232"/></g>
    <g class="panR" style="transition:transform .6s"></g><g class="panL" style="transition:transform .6s"></g>
    <g class="bugs"></g>
  `, 'מאזן בין מקדמי דלקת לנוגדי דלקת'));
  const svg = wrap.querySelector('svg');
  const panSVG = (items, col) => `<line x1="0" y1="0" x2="-34" y2="44" stroke="#535d73" stroke-width="1.5"/><line x1="0" y1="0" x2="34" y2="44" stroke="#535d73" stroke-width="1.5"/><path d="M-40 44 h80 q-6 14 -40 14 q-34 0 -40 -14z" fill="#c9d3e6" stroke="#535d73" stroke-width="1.5"/>${items.map((it, i) => `<rect x="-28" y="${26 - i * 19}" width="56" height="17" rx="5" fill="${col}"/><text x="0" y="${38 - i * 19}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${it}</text>`).join('')}`;
  const status = h('div', { class: 'panel', 'aria-live': 'polite' });
  const sw = h('div', { class: 'switches' });
  F.forEach(f => {
    const cb = h('input', { type: 'checkbox' }); cb.checked = st[f.k];
    cb.addEventListener('change', () => { st[f.k] = cb.checked; draw(); });
    sw.append(h('label', { class: 'sw ' + f.cls }, cb, h('span', {}, f.label)));
  });
  bidi(sw);
  function draw() {
    const pro = F.filter(f => f.side === 'pro' && st[f.k]), anti = F.filter(f => f.side === 'anti' && st[f.k]);
    const pw = pro.reduce((a, f) => a + f.w, 0), aw = anti.reduce((a, f) => a + f.w, 0);
    const th = Math.max(-16, Math.min(16, (pw - aw) * 6)), r = th * Math.PI / 180, L = 124;
    svg.querySelector('.beam').style.transform = `rotate(${th}deg)`;
    const pR = svg.querySelector('.panR'), pL = svg.querySelector('.panL');
    pR.innerHTML = panSVG(pro.map(f => f.label), '#c0392b'); pL.innerHTML = panSVG(anti.map(f => f.label), '#2e8b57');
    pR.style.transform = `translate(${180 + L * Math.cos(r)}px,${118 + L * Math.sin(r)}px)`;
    pL.style.transform = `translate(${180 - L * Math.cos(r)}px,${118 - L * Math.sin(r)}px)`;
    svg.querySelector('.bugs').innerHTML = st.inf ? bact(170, 224 - 4, 0) + bact(196, 222, 20) : '';
    const pro0 = st.il8 || st.tnf, anyAnti = st.il10 || st.aat, X = data.texts;
    let msg, state;
    if (st.smoke && !st.aat) { msg = X.smoke; state = 'harm'; }
    else if (st.smoke) { msg = X.smokeAAT; state = 'harm'; }
    else if (st.inf && pro0 && !anyAnti) { msg = X.fight; state = 'prot'; }
    else if (st.inf && anyAnti) { msg = X.fightBalanced; state = 'prot'; }
    else if (st.inf) { msg = X.noSignal; state = 'harm'; }
    else if (st.il10 && st.aat) { msg = X.recover; state = 'good'; }
    else if (pro0 && !anyAnti) { msg = X.chronic; state = 'harm'; }
    else if (pro0) { msg = X.weakening; state = 'harm'; }
    else { msg = X.rest; state = 'good'; }
    const lbl = { good: 'בריאה', prot: 'מגינה', harm: 'נפגעת' }[state];
    status.innerHTML = `<h4>מצב הרקמה: <span class="state-badge ${state}">${lbl}</span></h4><p>${esc(msg)}</p>`;
    bidi(status);
  }
  el.append(sw, status);
  draw();
};
