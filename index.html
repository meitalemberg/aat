  const ctx = makeCtx(u);

  if (sc.kind === 'intro') {
    card.append(h('div', { class: 'kicker' }, h('span', { class: 'crumb-n', html: uicon(UNIT_STYLE[u.id].icon, 16) }), unitLabel(u)), h('h2', {}, u.title));
    if (u.challenge) {
      card.append(h('p', { class: 'txt', html: rich(u.intro) }));
      if (Object.keys(store.challenge.res).length) card.append(h('div', { class: 'row-btns' }, h('button', { type: 'button', class: 'btn ghost small', onclick: () => { newChallenge(); go('#/u/6/1'); } }, 'התחלת האתגר מחדש, עם שאלות מעורבבות')));
    } else card.append(h('div', { class: 'goals' }, h('h3', {}, 'מטרות למידה'), h('ul', {}, u.goals.map(g => h('li', { html: rich(g) })))));
    card.append(h('p', { style: 'color:var(--muted)' }, 'לחצו "הבא" כדי להתחיל.'));
  } else if (sc.kind === 'content') {
    const ht = h('h2', {}, h('span', {}, sc.title));
    if (sc.ext) ht.append(h('span', { class: 'tag ext' }, 'הרחבה'));
    if (sc.tag) ht.append(h('span', { class: 'tag fix' }, sc.tag));
    card.append(ht);
    if (sc.text) card.append(h('div', { class: 'txt', html: /<p[ >]/.test(sc.text) ? rich(sc.text) : '<p>' + rich(sc.text) + '</p>' }));
    if (sc.fig && FIG[sc.fig]) { const f = h('div', { class: 'fig' }); card.append(f); FIG[sc.fig](f, sc.data || {}, {}); }
    if (sc.after) card.append(h('div', { class: 'after', html: /<p[ >]/.test(sc.after) ? rich(sc.after) : '<p>' + rich(sc.after) + '</p>' }));
  } else if (sc.kind === 'q') {
    const q = sc.q;
    const qno = u.challenge ? store.challenge.order.indexOf(q.id) + 1 : null;
    const kick = h('div', { class: 'kicker' }, h('span', { class: 'tag practice' }, q.type === 'predict' ? 'ניבוי' : q.type === 'explain' ? 'הסבר' : 'תרגול'), ' ',
      u.challenge ? `שאלה ${qno} מתוך ${store.challenge.order.length}` : (q.label ? q.label + ' · ' : '') + (q.type === 'predict' ? '' : 'ש' + q.id));
    if (q.ext) kick.append(' ', h('span', { class: 'tag ext' }, 'הרחבה'));
    card.append(kick, h('p', { class: 'qprompt', html: rich(q.prompt) }));
    if (q.fig && q.type !== 'hotspot' && FIG[q.fig]) {
      let data = q.figData;
      if (!data) { const src = u.screens && u.screens.find(s => s.fig === q.fig && s.data); data = src ? src.data : {}; }
      const f = h('div', { class: 'fig' }); card.append(f); FIG[q.fig](f, data, {});
    }
    card.append(COMP[q.type](q, ctx));
  } else if (sc.kind === 'end') {
    renderEnd(card, u);
  }

  const nav = h('nav', { class: 'nav', 'aria-label': 'ניווט בין מסכים' });
  const prev = h('button', { type: 'button', class: 'btn ghost', onclick: () => go(`#/u/${id}/${idx - 1}`) }, '→ הקודם');
  prev.disabled = idx === 0;
  nav.append(prev);
  if (sc.kind === 'end') nav.append(h('button', { type: 'button', class: 'btn', onclick: () => go('#/') }, 'למסך הבית'));
  else nav.append(h('button', { type: 'button', class: 'btn', onclick: () => go(`#/u/${id}/${idx + 1}`) }, idx === screens.length - 2 ? 'סיום ←' : 'הבא ←'));
  main.append(card, nav);
  app.append(main);
  bidi(main);
}

function renderEnd(card, u) {
  if (u.challenge) {
    const res = store.challenge.res;
    const qs = store.challenge.order.map(id => u.questions.find(q => q.id === id));
    const answered = qs.filter(q => gradeKeys(q).every(k => k in res));
    const right = qs.filter(q => gradeKeys(q).every(k => res[k] === true));
    card.append(h('h2', {}, 'התיק של יואב נסגר'), h('p', { class: 'txt' }, u.endText));
    card.append(h('div', { class: 'score' }, h('span', { class: 'big' }, `${right.length}/${qs.length}`), h('span', {}, 'תשובות נכונות בניסיון הראשון. הציון מוצג רק לך.')));
    if (answered.length < qs.length) card.append(h('p', { style: 'color:var(--muted)' }, `${qs.length - answered.length} שאלות לא נענו.`));
    const wrong = qs.filter(q => !gradeKeys(q).every(k => res[k] === true));
    if (wrong.length) {
      const ul = h('ul', { class: 'wrong-list' });
      wrong.forEach(q => {
        const n = store.challenge.order.indexOf(q.id) + 1, tu = PREPPED[q.unit];
        ul.append(h('li', {}, h('span', { html: `<strong>שאלה ${n}:</strong> ${esc(plain(q.prompt)).slice(0, 80)}${plain(q.prompt).length > 80 ? '…' : ''}` }),
          h('button', { type: 'button', class: 'btn ghost small', onclick: () => go(`#/u/${q.unit}/0`) }, 'חזרה ליחידה ' + tu.num)));
      });
      card.append(h('h3', {}, 'שאלות שכדאי לחזור אליהן'), ul);
    }
    card.append(h('div', { class: 'row-btns' }, h('button', { type: 'button', class: 'btn', onclick: () => { newChallenge(); go('#/u/6/1'); } }, 'נסו שוב')));
    return;
  }
  const st = store.units[u.id] || { q: {} };
  const keys = unitQuestions(u).flatMap(gradeKeys);
  const right = keys.filter(k => st.q[k] === true).length, answered = keys.filter(k => k in st.q).length;
  card.append(h('div', { class: 'kicker' }, 'יחידה ' + u.num), h('h2', {}, 'סיימתם את היחידה!'));
  if (keys.length) {
    card.append(h('div', { class: 'score' }, h('span', { class: 'big' }, `${right}/${keys.length}`), h('span', {}, 'תשובות נכונות בניסיון הראשון. הציון מוצג רק לך.')));
    if (answered < keys.length) card.append(h('p', { style: 'color:var(--muted)' }, `${keys.length - answered} שאלות לא נענו. אפשר לחזור אליהן בכפתור "הקודם".`));
  } else card.append(h('p', { class: 'txt' }, 'ביחידה הזו אין שאלות עם ציון.'));
  card.append(h('div', { class: 'goals' }, h('h3', {}, 'מטרות היחידה'), h('ul', {}, u.goals.map(g => h('li', { html: rich(g) })))));
  const ix = UNITS.findIndex(x => x.id === u.id), nx = UNITS[ix + 1];
  if (nx) card.append(h('div', { class: 'row-btns' }, h('button', { type: 'button', class: 'btn', onclick: () => openUnit(nx.id) }, (nx.challenge ? 'לאתגר המסכם' : 'ליחידה ' + nx.num) + ' ←')));
}

/* ---------- glossary ---------- */
function renderGlossary() {
  app.append(topbar());
  const main = h('main', { id: 'main' });
  const card = h('section', { class: 'card' }, h('h2', {}, 'מילון מונחים'));
  const inp = h('input', { type: 'search', class: 'gsearch', placeholder: 'חיפוש מונח…', 'aria-label': 'חיפוש מונח' });
  const list = h('div', { class: 'glist' });
  const keys = Object.keys(GLOSSARY).sort((a, b) => a.localeCompare(b, 'he'));
  const draw = () => {
    const f = inp.value.trim().toLowerCase(); list.innerHTML = '';
    keys.filter(k => !f || k.includes(f) || (GLOSSARY[k].en || '').toLowerCase().includes(f) || GLOSSARY[k].def.includes(f)).forEach(k => {
      const g = GLOSSARY[k];
      list.append(h('div', { class: 'gitem', id: 'g-' + k }, h('strong', {}, g.name || k), g.en ? h('bdi', { dir: 'ltr', class: 'en' }, g.en) : null, h('p', {}, g.def)));
    });
    if (!list.firstChild) list.append(h('p', { style: 'color:var(--muted)' }, 'לא נמצאו מונחים.'));
    bidi(list);
  };
  inp.addEventListener('input', draw);
  card.append(inp, list);
  main.append(card, h('div', { class: 'nav' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => history.length > 1 ? history.back() : go('#/') }, '→ חזרה')));
  app.append(main);
  draw();
}

/* ---------- router ---------- */
function render() {
  closeTerm();
  app.innerHTML = '';
  const m = location.hash.match(/^#\/u\/([0-9ab]+)\/(\d+)/);
  if (m && unitById(m[1])) renderUnit(m[1], +m[2]);
  else if (location.hash === '#/glossary') renderGlossary();
  else renderHome();
  window.scrollTo(0, 0);
  const h2 = app.querySelector('main h2, main h1');
  if (h2) { h2.setAttribute('tabindex', '-1'); h2.focus({ preventScroll: true }); }
}
render();
</script>
</body>
